services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ecabin
      POSTGRES_USER: ecabin
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-ecabin}
    ports: ["5432:5432"]
    volumes: ["ecabin-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecabin -d ecabin"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  ecabin-postgres:
