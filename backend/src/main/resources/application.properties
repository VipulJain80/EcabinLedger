server.port=${PORT:8080}
server.shutdown=graceful
server.forward-headers-strategy=framework

spring.application.name=ecabin-ledger-api
spring.servlet.multipart.max-file-size=20MB
# One file is accepted per evidence request; repeated requests are field-aggregated in AttachmentService.
# Retain the existing bounded request ceiling for all multipart endpoints.
spring.servlet.multipart.max-request-size=64MB
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres?connectTimeout=10&sslmode=prefer&currentSchema=ecabin_ledger
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.hikari.schema=${DB_SCHEMA:ecabin_ledger}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.hikari.connection-timeout=3000
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.schemas=${DB_SCHEMA:ecabin_ledger}
spring.flyway.default-schema=${DB_SCHEMA:ecabin_ledger}
spring.flyway.create-schemas=true
spring.flyway.user=postgres
spring.flyway.password=root
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI}

app.rate-limit.unauthenticated-per-minute=${API_RATE_LIMIT_UNAUTHENTICATED_PER_MINUTE:10}
app.attachments.provider=${ATTACHMENT_STORAGE_PROVIDER:azure}
app.attachments.local-path=${ATTACHMENT_LOCAL_PATH:/Users/vipuljain/Desktop/EcabinLedger/uploadimages}
app.attachments.azure-endpoint=${AZURE_STORAGE_ACCOUNT_URL:}
app.attachments.azure-container=${AZURE_STORAGE_CONTAINER:ecabin-evidence-private}
app.attachments.azure-connection-string=${AZURE_STORAGE_CONNECTION_STRING:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.security.audience=${OAUTH2_AUDIENCE}
app.reports.export.max-rows=${REPORT_EXPORT_MAX_ROWS:10000}
app.reports.export.max-duration-ms=${REPORT_EXPORT_MAX_DURATION_MS:120000}
app.reports.export.max-bytes=${REPORT_EXPORT_MAX_BYTES:52428800}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui
logging.structured.format.console=logstash
