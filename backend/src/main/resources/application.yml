server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
spring:
  application:
    name: ecabin-ledger-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ecabin}
    username: ${SPRING_DATASOURCE_USERNAME:ecabin}
    password: ${SPRING_DATASOURCE_PASSWORD:ecabin}
    hikari:
      schema: ${DB_SCHEMA:ecabin_ledger}
      maximum-pool-size: ${DB_POOL_SIZE:20}
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    schemas: ${DB_SCHEMA:ecabin_ledger}
    default-schema: ${DB_SCHEMA:ecabin_ledger}
    create-schemas: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI}
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  security:
    audience: ${OAUTH2_AUDIENCE}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
logging:
  structured:
    format:
      console: logstash
