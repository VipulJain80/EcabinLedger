server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
spring:
  application:
    name: ecabin-ledger-api
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 16MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres?connectTimeout=10&sslmode=prefer&currentSchema=ecabin_ledger}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    hikari:
      schema: ${DB_SCHEMA:ecabin_ledger}
      maximum-pool-size: ${DB_POOL_SIZE:20}
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    schemas: ${DB_SCHEMA:ecabin_ledger}
    default-schema: ${DB_SCHEMA:ecabin_ledger}
    create-schemas: true
    user: ${SPRING_FLYWAY_USER:${SPRING_DATASOURCE_USERNAME:postgres}}
    password: ${SPRING_FLYWAY_PASSWORD:${SPRING_DATASOURCE_PASSWORD:root}}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI}
app:
  rate-limit:
    unauthenticated-per-minute: ${API_RATE_LIMIT_UNAUTHENTICATED_PER_MINUTE:10}
  attachments:
    provider: ${ATTACHMENT_STORAGE_PROVIDER:azure}
    azure-endpoint: ${AZURE_STORAGE_ACCOUNT_URL:}
    azure-container: ${AZURE_STORAGE_CONTAINER:ecabin-evidence-private}
    azure-connection-string: ${AZURE_STORAGE_CONNECTION_STRING:}
    clamav-host: ${CLAMAV_HOST:}
    clamav-port: ${CLAMAV_PORT:3310}
    clamav-timeout-ms: ${CLAMAV_TIMEOUT_MS:5000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  security:
    audience: ${OAUTH2_AUDIENCE}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
logging:
  structured:
    format:
      console: logstash
